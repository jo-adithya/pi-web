<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML artifact preview</title>
<style>html { color-scheme: light; background: var(--background, white); color: var(--foreground, #17202a); font: 14px system-ui, sans-serif; } body { margin: 0; padding: 16px; overflow-wrap: anywhere; } svg, img { max-width: 100%; } img { height: auto; }
:where(.pw-stack) { display: flex; flex-direction: column; }
:where(.pw-row) { display: flex; flex-wrap: wrap; align-items: center; }
:where(.pw-grid) { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
:where(.pw-card) { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); padding: 16px; border-radius: 12px; min-width: 0; }
:where(.pw-title) { margin: 0; font-size: clamp(20px, 3vw, 32px); line-height: 1.25; }
:where(.pw-text) { margin: 0; line-height: 1.6; }
:where(.pw-muted) { color: var(--muted-foreground); }
:where(.pw-small) { font-size: 14px; }
:where(.pw-gap-1) { gap: 4px; }
:where(.pw-gap-2) { gap: 8px; }
:where(.pw-gap-3) { gap: 16px; }
:where(.pw-gap-4) { gap: 24px; }
:where(.pw-pad-1) { padding: 4px; }
:where(.pw-pad-2) { padding: 8px; }
:where(.pw-pad-3) { padding: 16px; }
:where(.pw-pad-4) { padding: 24px; }
.pw-diagram { margin-block: 12px; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius, 10px); overflow: hidden; background: var(--background); color: var(--foreground); }
.pw-diagram .pw-diagram-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; padding: 4px 8px; border-bottom: 1px solid var(--border); font: 14px system-ui, sans-serif; }
.pw-diagram .pw-diagram-controls button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; margin: 0; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--foreground); font: inherit; cursor: pointer; }
.pw-diagram button:focus-visible, .pw-diagram-viewport:focus-visible { outline: 2px solid var(--primary); outline-offset: -3px; }
.pw-diagram .pw-diagram-scale { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.pw-diagram .pw-diagram-viewport { position: relative; width: 100%; min-height: 240px; max-height: 480px; overflow: hidden; touch-action: none; user-select: none; cursor: grab; }
.pw-diagram .pw-diagram-viewport:active { cursor: grabbing; }
.pw-diagram .pw-diagram-help { margin: 0; padding: 6px 10px; border-top: 1px solid var(--border); color: var(--muted-foreground); font: 12px/1.5 system-ui, sans-serif; }
</style>
<body>
<script>
// Inline classic scripts execute only inside this opaque-origin sandbox.

let hasArtifact = false;
function applyTheme(theme) {

  root.classList.toggle("dark", theme.dark);

  const colors = theme.colors;
  if (colors && typeof colors === "object") {
    for (const name of "background foreground card card-foreground muted muted-foreground primary primary-foreground primary-muted primary-border error error-foreground error-muted error-border success success-foreground success-muted success-border warning warning-foreground warning-muted warning-border info info-foreground info-muted info-border cyan cyan-foreground cyan-muted cyan-border orange orange-foreground orange-muted orange-border pink pink-foreground pink-muted pink-border border accent accent-foreground secondary secondary-foreground radius".split(" ")) {
      if (typeof colors[name] === "string" && colors[name].length <= 256) root.style.setProperty(`--${name}`, colors[name]);
    }
  }
}
// Original 24px outline geometry; only these trusted paths become SVG content.
const iconPaths = {
  "arrow-right": "M4 12h16m-7-7 7 7-7 7",
  "arrow-left": "M20 12H4m7-7-7 7 7 7",
  check: "m5 12 4 5L19 6",
  x: "m6 6 12 12M6 18 18 6",
  info: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 11v6m0-10v.5",
  warning: "M12 3 22 21H2ZM12 9v5m0 3v.5",
  code: "m8 6-6 6 6 6m8-12 6 6-6 6m-3-14-2 16",
  search: "M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0m-2 5 6 6",
  settings: "M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4",
  file: "M5 3h9l5 5v13H5ZM14 3v5h5M8 12h8m-8 4h6",
  folder: "M3 5h7l3 3h8v12H3Z",
  clock: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 6v6l4 3",
  plus: "M4 12h16M12 4v16",
  minus: "M4 12h16",
};
// Expand initial span markers, preserving their labels and wrapper attributes.
function materializeIcons(content) {
  for (const marker of content.querySelectorAll("span[data-icon]")) {
    const name = marker.getAttribute("data-icon");
    if (!Object.hasOwn(iconPaths, name)) continue;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [attribute, value] of Object.entries({
      viewBox: "0 0 24 24", width: "1em", height: "1em", fill: "none",
      stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round",
      "stroke-linejoin": "round", "aria-hidden": "true", focusable: "false",
    })) svg.setAttribute(attribute, value);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");

    svg.append(path);
    marker.prepend(svg);
  }
}
/** Gives existing vector diagrams a fitted, touch-friendly canvas without rasterizing text. */
function materializeDiagrams() {

    let view = { ...original };
    let zoom = 1;
    const pointers = new Map();
    const viewer = document.createElement("div");
    viewer.className = "pw-diagram";
    const controls = document.createElement("div");
    controls.className = "pw-diagram-controls";
    controls.setAttribute("role", "group");
    controls.setAttribute("aria-label", "Diagram zoom controls");
    const viewport = document.createElement("div");
    viewport.className = "pw-diagram-viewport";
    viewport.tabIndex = 0;
    viewport.setAttribute("role", "group");
    viewport.setAttribute("aria-label", "Zoomable diagram. Use plus or minus to zoom, arrow keys to pan, and zero to fit.");
    viewport.style.aspectRatio = `${original.width} / ${original.height}`;
    const scaleLabel = document.createElement("span");
    scaleLabel.className = "pw-diagram-scale";
    const help = document.createElement("p");
    help.className = "pw-diagram-help";
    help.textContent = "Pinch to zoom · Drag to pan · Ctrl/⌘ + scroll to zoom";
    svg.before(viewer);
    viewer.append(controls, viewport, help);
    viewport.append(svg);
    // Override fixed artifact sizing and slice alignment that can crop mobile diagrams.
    for (const [name, value] of Object.entries({ position: "absolute", inset: "0", width: "100%", height: "100%", "min-width": "0", "min-height": "0", "max-width": "none", "max-height": "none", "box-sizing": "border-box", padding: "0", margin: "0", transform: "none", display: "block" })) {
      svg.style.setProperty(name, value, "important");
    }
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    const render = () => {
      svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);
      scaleLabel.textContent = `${Math.round(zoom * 100)}%`;
    };
    const fit = () => { zoom = 1; view = { ...original }; render(); };
    const unitScale = bounds => Math.min(bounds.width / view.width, bounds.height / view.height);
    // Anchor zoom at the gesture midpoint, including SVG letterboxing. Moving the
    // midpoint also pans, so two-finger gestures do not jump between operations.
    const navigate = (factor, from, to = from) => {
      const bounds = svg.getBoundingClientRect();
      const scale = unitScale(bounds);
      if (!(scale > 0)) return;
      const anchor = {
        x: view.x + (from.x - bounds.left - (bounds.width - view.width * scale) / 2) / scale,
        y: view.y + (from.y - bounds.top - (bounds.height - view.height * scale) / 2) / scale,
      };
      const nextZoom = Math.max(0.25, Math.min(32, zoom * factor));
      factor = nextZoom / zoom;
      view.x = anchor.x - (anchor.x - view.x) / factor;
      view.y = anchor.y - (anchor.y - view.y) / factor;
      view.width /= factor;
      view.height /= factor;
      zoom = nextZoom;
      const nextScale = unitScale(bounds);
      view.x -= (to.x - from.x) / nextScale;
      view.y -= (to.y - from.y) / nextScale;
      render();
    };
    const center = () => {
      const bounds = viewport.getBoundingClientRect();
      return { x: bounds.left + bounds.width / 2, y: bounds.top + bounds.height / 2 };
    };
    const button = (text, label, action) => {
      const control = document.createElement("button");
      control.type = "button";
      control.textContent = text;
      control.setAttribute("aria-label", label);
      control.addEventListener("click", action);
      controls.append(control);
    };
    button("−", "Zoom out", () => navigate(1 / 1.4, center()));
    button("+", "Zoom in", () => navigate(1.4, center()));
    button("Fit", "Fit entire diagram", fit);
    controls.append(scaleLabel);
    const gesture = () => {
      const points = [...pointers.values()].slice(0, 2);
      const first = points[0], second = points[1] || first;
      return { x: (first.x + second.x) / 2, y: (first.y + second.y) / 2, distance: Math.hypot(second.x - first.x, second.y - first.y) };
    };
    viewport.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      viewport.setPointerCapture(event.pointerId);
      viewport.focus({ preventScroll: true });
    });
    viewport.addEventListener("pointermove", event => {
      if (!pointers.has(event.pointerId)) return;
      const before = gesture();
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      const after = gesture();
      navigate(before.distance > 0 && after.distance > 0 ? after.distance / before.distance : 1, before, after);
    });
    const release = event => pointers.delete(event.pointerId);
    for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) viewport.addEventListener(name, release);
    viewport.addEventListener("wheel", event => {
      // Ordinary scrolling still moves the conversation, not the diagram.
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1);
      navigate(Math.exp(-Math.max(-100, Math.min(100, pixels)) * 0.01), { x: event.clientX, y: event.clientY });
    }, { passive: false });
    viewport.addEventListener("keydown", event => {
      if (event.target !== viewport || event.ctrlKey || event.metaKey || event.altKey) return;
      if (["+", "=", "-", "0", "Home", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) event.preventDefault();
      if (event.key === "+" || event.key === "=") navigate(1.4, center());
      else if (event.key === "-") navigate(1 / 1.4, center());
      else if (event.key === "0" || event.key === "Home") fit();
      else {
        const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
        const move = moves[event.key];
        if (!move) return;
        view.x += move[0] * view.width * 0.1;
        view.y += move[1] * view.height * 0.1;
        render();
      }
    });
    fit();
  }
}
/** Reports bounded CSS-pixel content height without treating the viewport floor as content. */
function observeHeight() {

    const body = document.body;

    // for real overflow; always use the intrinsic border box to allow shrinking.
    const overflow = body.scrollHeight > Math.max(body.clientHeight, document.documentElement.clientHeight) ? body.scrollHeight : 0;

    previous = height;
    parent.postMessage({ type: "pi-web-artifact-size", height }, "*");

  // images as local blobs, keeping data: and remote URLs blocked even inside CSS.

    const match = /^data:image\/(png|jpeg);base64,([A-Za-z0-9+/]+={0,2})$/.exec(image.getAttribute("src") || "");

    const bytes = Uint8Array.from(atob(match[2]), character => character.charCodeAt(0));

    const library = document.createElement("script");
    library.textContent = event.data.chartJs;
    document.body.prepend(library);
  }
  for (const inert of scripts) {
    if (inert.hasAttribute("src") || !["", "text/javascript", "application/javascript"].includes((inert.getAttribute("type") || "").trim().toLowerCase()) || inert.dataset.library === "chart.js") {
      inert.remove(); continue;
    }
    const executable = document.createElement("script");
    executable.textContent = inert.textContent;
    inert.replaceWith(executable);
  }
  materializeDiagrams();
  observeHeight();
}
window.addEventListener("message", receiveArtifact);
</script>
