<!doctype html>

<title>HTML artifact preview</title>
<style>html { color-scheme: light; background: var(--background, white); color: var(--foreground, #17202a); font: 14px system-ui, sans-serif; } body { margin: 0; padding: 16px; overflow-wrap: anywhere; } svg, img { max-width: 100%; } img { height: auto; }
:where(.pw-stack) { display: flex; flex-direction: column; }
:where(.pw-row) { display: flex; flex-wrap: wrap; align-items: center; }
:where(.pw-grid) { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
:where(.pw-card) { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); padding: 16px; border-radius: 12px; min-width: 0; }
:where(.pw-title) { margin: 0; font-size: clamp(20px, 3vw, 32px); line-height: 1.25; }
:where(.pw-text) { margin: 0; line-height: 1.6; }
:where(.pw-muted) { color: var(--muted-foreground); }
:where(.pw-small) { font-size: 14px; }
:where(.pw-gap-1) { gap: 4px; }
:where(.pw-gap-2) { gap: 8px; }
:where(.pw-gap-3) { gap: 16px; }
:where(.pw-gap-4) { gap: 24px; }
:where(.pw-pad-1) { padding: 4px; }
:where(.pw-pad-2) { padding: 8px; }
:where(.pw-pad-3) { padding: 16px; }
:where(.pw-pad-4) { padding: 24px; }
</style>

      if (typeof colors[name] === "string" && colors[name].length <= 256) root.style.setProperty(`--${name}`, colors[name]);
    }
  }
}

const iconPaths = {
  "arrow-right": "M4 12h16m-7-7 7 7-7 7",
  "arrow-left": "M20 12H4m7-7-7 7 7 7",
  check: "m5 12 4 5L19 6",
  x: "m6 6 12 12M6 18 18 6",
  info: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 11v6m0-10v.5",
  warning: "M12 3 22 21H2ZM12 9v5m0 3v.5",
  code: "m8 6-6 6 6 6m8-12 6 6-6 6m-3-14-2 16",
  search: "M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0m-2 5 6 6",
  settings: "M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4",
  file: "M5 3h9l5 5v13H5ZM14 3v5h5M8 12h8m-8 4h6",
  folder: "M3 5h7l3 3h8v12H3Z",
  clock: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 6v6l4 3",
  plus: "M4 12h16M12 4v16",
  minus: "M4 12h16",
};
// Expand initial span markers, preserving their labels and wrapper attributes.
function materializeIcons(content) {
  for (const marker of content.querySelectorAll("span[data-icon]")) {
    const name = marker.getAttribute("data-icon");
    if (!Object.hasOwn(iconPaths, name)) continue;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [attribute, value] of Object.entries({
      viewBox: "0 0 24 24", width: "1em", height: "1em", fill: "none",
      stroke: "currentColor", "stroke-width": "2", "stroke-linecap": "round",
      "stroke-linejoin": "round", "aria-hidden": "true", focusable: "false",

/** Reports bounded CSS-pixel content height without treating the viewport floor as content. */
function observeHeight() {
  let previous = 0;
  const measure = () => {
    const body = document.body;

    // for real overflow; always use the intrinsic border box to allow shrinking.
    const overflow = body.scrollHeight > Math.max(body.clientHeight, document.documentElement.clientHeight) ? body.scrollHeight : 0;

    previous = height;
    parent.postMessage({ type: "pi-web-artifact-size", height }, "*");

    return;
  }
  if (hasArtifact || event.data?.type !== "pi-web-artifact" || typeof event.data.html !== "string" || event.data.html.length > 524288) return;
  hasArtifact = true;

  content.innerHTML = event.data.html;

    const library = document.createElement("script");
    library.textContent = event.data.chartJs;
    document.body.prepend(library);
  }

      inert.remove(); continue;
    }
    const executable = document.createElement("script");
    executable.textContent = inert.textContent;
    inert.replaceWith(executable);
  }
  observeHeight();

window.addEventListener("message", receiveArtifact);
</script>
