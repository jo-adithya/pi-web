[package]
name = "pi-web"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
ts-rs = "=12.0.1"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "process", "rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
libc = "=0.2.191"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
